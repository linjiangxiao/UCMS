			<a href="../index.html">帮助中心</a>&gt;<a href="2.html">后台使用说明</a>&gt;			<h1>栏目域名绑定</h1>
		</div>
		<div class="article_content">
		UCMS支持栏目绑定域名，不同域名可以对应到不同的栏目。<br />
<p>
	<strong>绑定域名前请在配置文件中设置网站的主域名(SystemDomain)，多个域名用;分隔。</strong> 
</p>
<p>
	<br />
</p>
<p>
	默认的栏目地址为 /(cid)/，栏目绑定域名后,则栏目的网址为&nbsp;http://(栏目域名)/(cid)/。
</p>
<p>
	如您需要 <span style="white-space:normal;">http://(栏目域名)/&nbsp; 直接显示栏目内容 ，只需要将默认的栏目地址 <span style="white-space:normal;">/(cid)/ </span>改成 /</span>。
</p>
<p>
	<span style="white-space:normal;"><br />
</span> 
</p>
<p>
	简单的站群:
</p>
<p>
	建立多个栏目，每个栏目设置绑定单独的域名，栏目地址都改成 /。
</p>
<p>
	每个栏目设置不同的模板文件，即可做成简单的站群,可以实现一个空间内绑定多个网站。
</p>
<p>
	<br />
</p>
<p>
	<br />
