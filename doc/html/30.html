<!DOCTYPE html>
<html>

<meta charset="utf-8"/>
<title>同时获取多个栏目的文章列表-UCMS</title>
<link rel="stylesheet" type="text/css" href="../css/style.css" />
</head>
<body>

<div class="warp">
	<div class="main_left">
		<div class="article_nav">
			<a href="../index.html">帮助中心</a>&gt;<a href="3.html">模板制作指南</a>&gt;<a href="27.html">输出文章列表</a>&gt;			<h1>同时获取多个栏目的文章列表</h1>
		</div>
		<div class="article_content">
		<p>
	<br />
</p>
<p style="white-space:normal;">
	1.3.5版本开始支持获取多个栏目的文章,栏目的表必须相同,具体请查看<a href="28.html" target="_blank">alist函数参数</a>
</p>
<p style="white-space:normal;">
	不再建议使用all_list函数
</p>
<p style="white-space:normal;">
	<br />
</p>
<p>
	使用以下函数可以获取所有文章栏目的文章最新的10篇文章,只能按照最新发布的排序
</p>
<p>
	<pre class="brush:php prettyprint lang-php" data-language="php">&lt;?php  
all_list($set,10);
?&gt;</pre>
</p>
<p>
	$set参数的具体与<a href="28.html" target="_blank">alist函数参数</a>一致
</p>
<p>
	如需获取指定某几个栏目的文章可以使用以下代码
</p>
<p>
	<pre class="brush:php prettyprint lang-php" data-language="php">&lt;?php  
all_list($set,10,array(1,2,3));
?&gt;</pre>
</p>
<p>
	<br />
</p>
