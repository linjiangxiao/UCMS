		<p>
	UCMS支持中文网址,在开启伪静态的环境中,可以随意配置栏目网址.
</p>
<p>
	不同空间环境请选择不同的配置方法.
</p>
<p>
	安装UCMS时,系统会自动判断是否支持伪静态.
</p>
<p>
	如果UCMS安装在二级目录,不建议开启伪静态.
</p>
<p>
	<br />
</p>
<p>
	安装程序后如何开启或关闭伪静态:移除伪静态代码后,
</p>
<p>
	在配置文件[<span style="white-space:normal;">inc/config.php</span>]中,按提示修改:define('UrlRewrite',1);//启用伪静态,1为开启,0为关闭
</p>		</div>
