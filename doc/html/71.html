		<p>
	栏目单选、多选字段可方便灵活读取所选栏目信息,不必在模板中固定栏目cid.
</p>
<p>
	如下图展示的栏目 教师风采 友情链接可在站点变量中分别添加 两个栏目单选字段 来指定栏目cid,不需要写死在模板中.
</p>
<p>
	党团工会 教学管理 教育科研 总务后期 4个栏目可以在站点变量中添加一个栏目多选字段,循环输出栏目文章列表.
</p>
<p>
	具体调用代码可以在后台 变量或字段 列表中点击'调用'查看.
</p>
