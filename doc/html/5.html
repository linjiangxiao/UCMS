		<p>
	<strong>SQLite</strong> 
</p>
<p>
	推荐企业站或小型网站使用
</p>
<p>
	优点是容易备份,转移空间方便,无需配置环境,备份只需下载数据库文件即可
</p>
<p>
	<span style="white-space:normal;">缺点是</span>数据维护没有MySQL方便,某些空间可能没有pdo_sqlite组件
</p>
<p>
	<br />
</p>
<p>
	<strong>MySQL</strong> 
</p>
<p>
	<strong> </strong>推荐文章数量多的网站使用
</p>
<p>
	优点是稳定,性能较好,维护方便,维护工具多
</p>
<p>
	缺点是转移空间麻烦,有些空间可能没有mysql数据库
</p>
